<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Toko Elektronik Priangan Jaya</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1>Reset Password</h1>
    <p class="sub">Masukkan password baru Anda.</p>
    <form id="formReset">
      <label for="passwordBaru">Password Baru</label>
      <input id="passwordBaru" name="passwordBaru" type="password" autocomplete="new-password" minlength="6" required>
      <button type="submit">Simpan Password</button>
    </form>
    <div id="pesan" class="pesan" hidden></div>
    <a class="link" href="/login.html">Kembali ke Login</a>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
