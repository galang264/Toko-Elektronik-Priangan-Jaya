<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa Password - Toko Elektronik Priangan Jaya</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1>Lupa Password</h1>
    <p class="sub">Masukkan email akun Anda. Link reset akan dikirim ke email tersebut.</p>
    <form id="formLupa">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <button type="submit">Kirim Link Reset</button>
    </form>
    <div id="pesan" class="pesan" hidden></div>
    <a class="link" href="/login.html">Kembali ke Login</a>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
